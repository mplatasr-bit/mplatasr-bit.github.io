<!--HTML is made up of elements-->

<!DOCTYPE html> 
<html>
<!--ELEMENTS are just boxes that we place content in-->
<!--ELEMENTS are mede up of tags and attributes-->
<!--TAGS look like <sometag> CONTENT </sometag> -->

<!--overall structure of HTML elements are: <sometag>CONTENT FOR THAT ELEMENT</sometag>-->

<!--attributes are descriptors of elements that provide more context or provide customization to an element-->

<head>
     <!--HEAD element provides metadata-->

    <title>My first page!</title>

</head>

<body> <!--the body renders everything that we see in the viewpoint or we interact with -->

    <!--the style attribute styles an element-->

    <h1>Hi everyone! </h1>
  
    <p style="background-color:pink; font-size: 48px;">
        Helloooooooooooooooooooooooo!!!!!!!!!!!
    </p>
    
    <!--ELEMENTS are mede up of tags (mandatory), attribute (optional), content (what is in the element)-->
 
     
    <p style="font-family: 'Arial'">
 
        <h2>Boxes within Boxes Example</h2>
       
        hi hi hi hi hiiiiiiiiiiiiiiiiiiiii!!!!!!!!
       
        <h3> Best ships in sci-fi</h3>
        <ul>
            <li>Millennium Falcon</li>
        </ul>

    </p>
</body>

</html>
